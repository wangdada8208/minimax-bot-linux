name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci || npm install
      - run: npm test
      - run: node --check src/host.mjs
      - run: node --check src/agent.mjs
      - run: bash -n scripts/install.sh scripts/update-upstream.sh scripts/watchdog.sh
