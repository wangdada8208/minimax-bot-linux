name: upstream-check

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: versions
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/MiniMax-AI/MiniMax-Code-MiniApps.git /tmp/up
          git -C /tmp/up sparse-checkout set plugins/minimax-ai/minimax-bot
          commit="$(git -C /tmp/up rev-parse HEAD)"
          latest="$(node -p "require('/tmp/up/plugins/minimax-ai/minimax-bot/.minimax-plugin/plugin.json').version")"
          pinned="$(node -p "require('./upstream.lock.json').pluginVersion")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

      - if: steps.versions.outputs.latest != steps.versions.outputs.pinned
        uses: actions/github-script@v7
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
          PINNED: ${{ steps.versions.outputs.pinned }}
          COMMIT: ${{ steps.versions.outputs.commit }}
        with:
          script: |
            const title = `Upstream MiniMax Bot ${process.env.LATEST} available (pinned ${process.env.PINNED})`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream',
            });
            if (open.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['upstream'],
              body: [
                `Upstream MiniMax Bot is now **${process.env.LATEST}** (pinned: ${process.env.PINNED}).`,
                '',
                `Run \`npm run update-upstream\`, review the diff, then restart the host.`,
                '',
                `Upstream commit: \`${process.env.COMMIT}\``,
              ].join('\n'),
            });
