name: upstream-check

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare both complete upstream revisions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const lock = JSON.parse(fs.readFileSync('upstream.lock.json', 'utf8'));
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream', per_page: 100,
            });
            for (const key of ['plugin', 'runtime']) {
              const [owner, repo] = lock[key].repository.split('/');
              const { data: latest } = await github.rest.repos.getCommit({ owner, repo, ref: 'main' });
              if (latest.sha === lock[key].commit) continue;
              const title = `Upstream ${key} changed: ${latest.sha.slice(0, 12)}`;
              if (open.some((issue) => issue.title === title)) continue;
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, labels: ['upstream'],
                body: [
                  `Pinned: ${lock[key].commit}`,
                  `Candidate: ${latest.sha}`,
                  `Compare: https://github.com/${owner}/${repo}/compare/${lock[key].commit}...${latest.sha}`,
                  '',
                  'Review the complete upstream diff with `npm run update-upstream`.',
                  'An accepted runtime pin requires rebuilding the official CLI and generated runtime bundle,',
                  'reviewing source provenance, and passing protocol/startup/live team-tool checks.',
                  'Keep upstream source files unchanged. Commit pins and generated artifacts together.',
                ].join('\n'),
              });
            }
